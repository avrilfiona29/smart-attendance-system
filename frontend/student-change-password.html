<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    body { background:#f9f9ff; }
    .box {
      max-width:450px;
      margin:auto;
      margin-top:60px;
      padding:30px;
      background:white;
      border-radius:10px;
      box-shadow:0 0 12px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>
  <div class="box">
    <h3 class="text-center" style="color:#6a5acd;">🔒 Change Password</h3>

    <form id="passwordForm">
      <label class="form-label mt-3">Old Password</label>
      <input type="password" class="form-control" required>

      <label class="form-label mt-3">New Password</label>
      <input type="password" class="form-control" required>

      <button class="btn btn-primary w-100 mt-4" style="background:#6a5acd;">Update</button>
    </form>
  </div>

</body>
</html>
