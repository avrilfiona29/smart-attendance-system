<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students | Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
            <button class="btn btn-outline-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3><i class="fas fa-users me-2"></i>Student Management</h3>
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">
                                <i class="fas fa-plus me-2"></i>Add Student
                            </button>
                        </div>

                        <!-- Students Table -->
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>USN</th>
                                        <th>Department</th>
                                        <th>Year</th>
                                        <th>Email</th>
                                        <th>Images</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="studentsTableBody">
                                    <tr>
                                        <td colspan="8" class="text-center">
                                            <div class="spinner-border" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Student Modal -->
    <div class="modal fade" id="addStudentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addStudentForm">
                        <div class="mb-3">
                            <label class="form-label">Name *</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">USN *</label>
                            <input type="text" class="form-control" name="usn" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" name="department">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Year</label>
                            <input type="text" class="form-control" name="year">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password (Optional)</label>
                            <input type="text" class="form-control" name="password" placeholder="Leave empty to use USN as password">
                            <small class="text-muted">Default password will be the student's USN if left empty</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Upload Images (Max 5)</label>
                            <input type="file" class="form-control" name="images" multiple accept="image/*" id="studentImages">
                            <small class="text-muted">Select 3-5 clear face images for better recognition</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addStudent()">
                        <i class="fas fa-save me-2"></i>Save Student
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Student Modal -->
    <div class="modal fade" id="editStudentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editStudentForm">
                        <input type="hidden" id="editStudentId">
                        <div class="mb-3">
                            <label class="form-label">Name *</label>
                            <input type="text" class="form-control" id="editName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">USN *</label>
                            <input type="text" class="form-control" id="editUsn" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" id="editDepartment">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Year</label>
                            <input type="text" class="form-control" id="editYear">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="editEmail">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateStudent()">
                        <i class="fas fa-save me-2"></i>Update
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../config.js"></script>
    <script>
        if (sessionStorage.getItem('userRole') !== 'admin') {
            window.location.href = '../index.html';
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '../index.html';
        }

        // Load students
        async function loadStudents() {
            try {
                const students = await apiCall(API.students.all);
                const tbody = document.getElementById('studentsTableBody');
                
                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center">No students found</td></tr>';
                    return;
                }

                tbody.innerHTML = students.map(student => `
                    <tr>
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.usn}</td>
                        <td>${student.department || '-'}</td>
                        <td>${student.year || '-'}</td>
                        <td>${student.email || '-'}</td>
                        <td>
                            <span class="badge bg-info">${student.images?.length || 0} images</span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick='editStudentModal(${JSON.stringify(student)})'>
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteStudent(${student.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                alert('Error loading students: ' + error.message);
            }
        }

        // Add student
        async function addStudent() {
            const form = document.getElementById('addStudentForm');
            const formData = new FormData(form);
            
            const files = document.getElementById('studentImages').files;
            if (files.length > 5) {
                alert('Maximum 5 images allowed');
                return;
            }

            try {
                const response = await fetch(API.students.add, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (response.ok) {
                    alert('Student added successfully!');
                    bootstrap.Modal.getInstance(document.getElementById('addStudentModal')).hide();
                    form.reset();
                    loadStudents();
                } else {
                    alert('Error: ' + (result.error || 'Failed to add student'));
                }
            } catch (error) {
                alert('Error adding student: ' + error.message);
            }
        }

        // Edit student modal
        function editStudentModal(student) {
            document.getElementById('editStudentId').value = student.id;
            document.getElementById('editName').value = student.name;
            document.getElementById('editUsn').value = student.usn;
            document.getElementById('editDepartment').value = student.department || '';
            document.getElementById('editYear').value = student.year || '';
            document.getElementById('editEmail').value = student.email || '';
            
            new bootstrap.Modal(document.getElementById('editStudentModal')).show();
        }

        // Update student
        async function updateStudent() {
            const id = document.getElementById('editStudentId').value;
            const data = {
                name: document.getElementById('editName').value,
                usn: document.getElementById('editUsn').value,
                department: document.getElementById('editDepartment').value,
                year: document.getElementById('editYear').value,
                email: document.getElementById('editEmail').value
            };

            try {
                const result = await apiCall(API.students.update(id), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                alert('Student updated successfully!');
                bootstrap.Modal.getInstance(document.getElementById('editStudentModal')).hide();
                loadStudents();
            } catch (error) {
                alert('Error updating student: ' + error.message);
            }
        }

        // Delete student
        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;

            try {
                await apiCall(API.students.delete(id), { method: 'DELETE' });
                alert('Student deleted successfully!');
                loadStudents();
            } catch (error) {
                alert('Error deleting student: ' + error.message);
            }
        }

        loadStudents();
    </script>
</body>
</html>
