<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance | Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .upload-area {
            border: 3px dashed #6c63ff;
            border-radius: 15px;
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #f8f5ff;
        }
        .upload-area:hover {
            background: #e8e5ff;
        }
        .upload-area i {
            font-size: 4rem;
            color: #6c63ff;
        }
        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            margin-top: 20px;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            background: white;
            box-shadow: 0px 6px 14px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
            <button class="btn btn-outline-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-body">
                        <h3 class="text-center mb-4">
                            <i class="fas fa-camera me-2"></i>Mark Attendance
                        </h3>

                        <!-- Upload Area -->
                        <div class="upload-area" id="uploadArea" onclick="document.getElementById('groupImage').click()">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <h4 class="mt-3">Click to Upload Group Photo</h4>
                            <p class="text-muted">or drag and drop here</p>
                            <input type="file" id="groupImage" accept="image/*" style="display: none;" onchange="previewImage(event)">
                        </div>

                        <!-- Image Preview -->
                        <div id="imagePreview" class="text-center" style="display: none;">
                            <img id="previewImg" class="preview-image">
                            <div class="mt-3">
                                <button class="btn btn-primary btn-lg" onclick="markAttendance()">
                                    <i class="fas fa-check-circle me-2"></i>Mark Attendance
                                </button>
                                <button class="btn btn-secondary btn-lg" onclick="resetUpload()">
                                    <i class="fas fa-times me-2"></i>Cancel
                                </button>
                            </div>
                        </div>

                        <!-- Loading -->
                        <div id="loadingDiv" class="text-center mt-4" style="display: none;">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Processing...</span>
                            </div>
                            <p class="mt-3">Processing image and recognizing faces...</p>
                        </div>

                        <!-- Results -->
                        <div id="resultDiv" class="result-box" style="display: none;">
                            <h4 class="text-center mb-4">Attendance Marked Successfully!</h4>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="alert alert-success">
                                        <h5><i class="fas fa-check-circle me-2"></i>Present (<span id="presentCount">0</span>)</h5>
                                        <ul id="presentList" class="mb-0"></ul>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="alert alert-danger">
                                        <h5><i class="fas fa-times-circle me-2"></i>Absent (<span id="absentCount">0</span>)</h5>
                                        <ul id="absentList" class="mb-0"></ul>
                                    </div>
                                </div>
                            </div>

                            <div class="text-center mt-3">
                                <button class="btn btn-primary" onclick="resetUpload()">
                                    <i class="fas fa-plus me-2"></i>Mark Another Attendance
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../config.js"></script>
    <script>
        if (sessionStorage.getItem('userRole') !== 'admin') {
            window.location.href = '../index.html';
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '../index.html';
        }

        let selectedFile = null;

        // Drag and drop
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#e8e5ff';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = '#f8f5ff';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#f8f5ff';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('groupImage').files = files;
                previewImage({ target: { files: files } });
            }
        });

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFile = file;
            const reader = new FileReader();
            
            reader.onload = function(e) {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('uploadArea').style.display = 'none';
                document.getElementById('imagePreview').style.display = 'block';
            };
            
            reader.readAsDataURL(file);
        }

        async function markAttendance() {
            if (!selectedFile) {
                alert('Please select an image first');
                return;
            }

            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('loadingDiv').style.display = 'block';

            const formData = new FormData();
            formData.append('groupImage', selectedFile);

            try {
                const response = await fetch(API.attendance.mark, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                document.getElementById('loadingDiv').style.display = 'none';

                if (response.ok && result.success) {
                    displayResults(result.result);
                } else {
                    alert('Error: ' + (result.error || 'Failed to mark attendance'));
                    resetUpload();
                }
            } catch (error) {
                document.getElementById('loadingDiv').style.display = 'none';
                alert('Error marking attendance: ' + error.message);
                resetUpload();
            }
        }

        function displayResults(result) {
            const presentList = document.getElementById('presentList');
            const absentList = document.getElementById('absentList');
            
            document.getElementById('presentCount').textContent = result.present?.length || 0;
            document.getElementById('absentCount').textContent = result.absent?.length || 0;

            presentList.innerHTML = result.present?.map(name => `<li>${name}</li>`).join('') || '<li>None</li>';
            absentList.innerHTML = result.absent?.map(name => `<li>${name}</li>`).join('') || '<li>None</li>';

            document.getElementById('resultDiv').style.display = 'block';
        }

        function resetUpload() {
            selectedFile = null;
            document.getElementById('groupImage').value = '';
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('resultDiv').style.display = 'none';
            document.getElementById('loadingDiv').style.display = 'none';
        }
    </script>
</body>
</html>
