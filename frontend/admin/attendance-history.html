<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance History | Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
            <button class="btn btn-outline-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3><i class="fas fa-history me-2"></i>Attendance History</h3>
                            <div>
                                <input type="date" class="form-control d-inline-block" id="dateFilter" style="width: auto;">
                                <button class="btn btn-primary" onclick="filterByDate()">
                                    <i class="fas fa-filter me-2"></i>Filter
                                </button>
                                <button class="btn btn-secondary" onclick="loadHistory()">
                                    <i class="fas fa-sync me-2"></i>Show All
                                </button>
                            </div>
                        </div>

                        <!-- History Table -->
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Date & Time</th>
                                        <th>Present</th>
                                        <th>Absent</th>
                                        <th>Total</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="historyTableBody">
                                    <tr>
                                        <td colspan="5" class="text-center">
                                            <div class="spinner-border" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Attendance Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="alert alert-success">
                                <h5><i class="fas fa-check-circle me-2"></i>Present Students</h5>
                                <ul id="modalPresentList"></ul>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="alert alert-danger">
                                <h5><i class="fas fa-times-circle me-2"></i>Absent Students</h5>
                                <ul id="modalAbsentList"></ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../config.js"></script>
    <script>
        if (sessionStorage.getItem('userRole') !== 'admin') {
            window.location.href = '../index.html';
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '../index.html';
        }

        // Load attendance history
        async function loadHistory() {
            try {
                const history = await apiCall(API.attendance.history);
                const tbody = document.getElementById('historyTableBody');
                
                if (history.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">No attendance records found</td></tr>';
                    return;
                }

                tbody.innerHTML = history.map((record, index) => {
                    const date = new Date(record.date);
                    const presentCount = record.present?.length || 0;
                    const absentCount = record.absent?.length || 0;
                    const total = presentCount + absentCount;

                    return `
                        <tr>
                            <td>${date.toLocaleString()}</td>
                            <td><span class="badge bg-success">${presentCount}</span></td>
                            <td><span class="badge bg-danger">${absentCount}</span></td>
                            <td><span class="badge bg-primary">${total}</span></td>
                            <td>
                                <button class="btn btn-sm btn-info" onclick='showDetails(${JSON.stringify(record)})'>
                                    <i class="fas fa-eye"></i> View
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                alert('Error loading history: ' + error.message);
            }
        }

        // Filter by date
        async function filterByDate() {
            const date = document.getElementById('dateFilter').value;
            if (!date) {
                alert('Please select a date');
                return;
            }

            try {
                const result = await apiCall(API.attendance.historyByDate(date));
                const tbody = document.getElementById('historyTableBody');

                if (result.message || !result.records || result.records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">No attendance found for this date</td></tr>';
                    return;
                }

                tbody.innerHTML = result.records.map(record => {
                    const dateObj = new Date(record.date);
                    const presentCount = record.present?.length || 0;
                    const absentCount = record.absent?.length || 0;
                    const total = presentCount + absentCount;

                    return `
                        <tr>
                            <td>${dateObj.toLocaleString()}</td>
                            <td><span class="badge bg-success">${presentCount}</span></td>
                            <td><span class="badge bg-danger">${absentCount}</span></td>
                            <td><span class="badge bg-primary">${total}</span></td>
                            <td>
                                <button class="btn btn-sm btn-info" onclick='showDetails(${JSON.stringify(record)})'>
                                    <i class="fas fa-eye"></i> View
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                alert('Error filtering by date: ' + error.message);
            }
        }

        // Show details modal
        function showDetails(record) {
            const presentList = document.getElementById('modalPresentList');
            const absentList = document.getElementById('modalAbsentList');

            presentList.innerHTML = record.present?.map(name => `<li>${name}</li>`).join('') || '<li>None</li>';
            absentList.innerHTML = record.absent?.map(name => `<li>${name}</li>`).join('') || '<li>None</li>';

            new bootstrap.Modal(document.getElementById('detailsModal')).show();
        }

        loadHistory();
    </script>
</body>
</html>
