<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-user-shield me-2"></i>Admin Dashboard
            </a>
            <div class="ms-auto">
                <span class="me-3">Welcome, <strong id="adminName">Admin</strong></span>
                <button class="btn btn-outline-danger" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="row g-4">
            <!-- Manage Students -->
            <div class="col-md-4">
                <div class="dashboard-card" onclick="location.href='students.html'">
                    <i class="fas fa-users"></i>
                    <h3>Manage Students</h3>
                    <p class="text-muted">Add, edit, or remove students</p>
                </div>
            </div>

            <!-- Mark Attendance -->
            <div class="col-md-4">
                <div class="dashboard-card" onclick="location.href='attendance.html'">
                    <i class="fas fa-camera"></i>
                    <h3>Mark Attendance</h3>
                    <p class="text-muted">Upload group photo</p>
                </div>
            </div>

            <!-- View Attendance -->
            <div class="col-md-4">
                <div class="dashboard-card" onclick="location.href='attendance-history.html'">
                    <i class="fas fa-history"></i>
                    <h3>Attendance History</h3>
                    <p class="text-muted">View past records</p>
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="row mt-5">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title mb-4">Quick Stats</h4>
                        <div class="row text-center">
                            <div class="col-md-4">
                                <h2 class="text-primary" id="totalStudents">0</h2>
                                <p class="text-muted">Total Students</p>
                            </div>
                            <div class="col-md-4">
                                <h2 class="text-success" id="presentToday">0</h2>
                                <p class="text-muted">Present Today</p>
                            </div>
                            <div class="col-md-4">
                                <h2 class="text-danger" id="absentToday">0</h2>
                                <p class="text-muted">Absent Today</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script>
        // Check authentication
        if (sessionStorage.getItem('userRole') !== 'admin') {
            window.location.href = '../index.html';
        }

        document.getElementById('adminName').textContent = sessionStorage.getItem('username') || 'Admin';

        function logout() {
            sessionStorage.clear();
            window.location.href = '../index.html';
        }

        // Load statistics
        async function loadStats() {
            try {
                // Get total students
                const studentsData = await apiCall(API.students.all);
                document.getElementById('totalStudents').textContent = studentsData.length || 0;

                // Get today's attendance
                const attendanceData = await apiCall(API.attendance.today);
                if (attendanceData.attendance && attendanceData.attendance.length > 0) {
                    const latest = attendanceData.attendance[attendanceData.attendance.length - 1];
                    document.getElementById('presentToday').textContent = latest.present?.length || 0;
                    document.getElementById('absentToday').textContent = latest.absent?.length || 0;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        loadStats();
    </script>
</body>
</html>
