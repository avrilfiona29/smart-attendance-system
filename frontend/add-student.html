<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f2f8ff;
            font-family: "Poppins", sans-serif;
        }
        .container-box {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #6c63ff;
            font-weight: 600;
            margin-bottom: 25px;
        }
        button {
            background: #6c63ff !important;
            border: none;
        }
    </style>
</head>

<body>

<div class="container-box">
    <h2>Add Student</h2>

    <form id="addStudentForm">
        <div class="mb-3">
            <label class="form-label">Student Name</label>
            <input type="text" class="form-control" id="studentName" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Register Number</label>
            <input type="text" class="form-control" id="studentReg" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Class</label>
            <input type="text" class="form-control" id="studentClass" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Upload Image</label>
            <input type="file" class="form-control" id="studentImage" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Add Student</button>
    </form>

    <p class="text-center mt-3"><a href="admin-dashboard.html">← Back to Dashboard</a></p>
</div>

<script src="add-student.js"></script>
</body>
</html>
