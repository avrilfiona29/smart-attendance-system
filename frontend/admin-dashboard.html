<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Smart Attendance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #f7f5ff, #eafcff);
            font-family: "Poppins", sans-serif;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: auto;
            padding: 50px 20px;
        }

        .title {
            text-align: center;
            font-size: 35px;
            font-weight: 700;
            color: #6c63ff;
            margin-bottom: 40px;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff6b6b;
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .logout-btn:hover {
            background: #ff4a4a;
        }

        .card-box {
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
            transition: 0.3s;
            text-align: center;
            cursor: pointer;
            background: white;
        }
        .card-box:hover {
            transform: translateY(-6px);
            box-shadow: 0px 6px 16px rgba(0,0,0,0.12);
        }

        .card-icon {
            font-size: 45px;
            margin-bottom: 15px;
            color: #6c63ff;
        }
    </style>
</head>

<body>

<button class="logout-btn" onclick="window.location.href='/login.html'">Logout</button>

<div class="dashboard-container">

    <div class="title">Admin Dashboard</div>

    <div class="row g-4">

        <div class="col-md-3">
            <a href="add-student.html">
                <div class="card-box">
                    <div class="card-icon">➕</div>
                    <h5>Add Student</h5>
                </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="students.html">
                <div class="card-box">
                    <div class="card-icon">👥</div>
                    <h5>View Students</h5>
                </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="upload-group.html">
                <div class="card-box">
                    <div class="card-icon">📤</div>
                    <h5>Upload Group Photo</h5>
                </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="attendance.html">
                <div class="card-box">
                    <div class="card-icon">📊</div>
                    <h5>Attendance</h5>
                </div>
            </a>
        </div>

    </div>
</div>

</body>
</html>
