<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-user-graduate me-2"></i>Student Dashboard
            </a>
            <div class="ms-auto">
                <span class="me-3">Welcome, <strong id="studentName">Student</strong></span>
                <button class="btn btn-outline-danger" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="row g-4">
            <!-- View Attendance -->
            <div class="col-md-6">
                <div class="dashboard-card" onclick="location.href='attendance.html'">
                    <i class="fas fa-calendar-check"></i>
                    <h3>My Attendance</h3>
                    <p class="text-muted">View your attendance records</p>
                </div>
            </div>

            <!-- Profile -->
            <div class="col-md-6">
                <div class="dashboard-card" onclick="location.href='profile.html'">
                    <i class="fas fa-user"></i>
                    <h3>My Profile</h3>
                    <p class="text-muted">View and update profile</p>
                </div>
            </div>
        </div>

        <!-- Attendance Summary -->
        <div class="row mt-5">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title mb-4">Attendance Summary</h4>
                        <div class="row text-center">
                            <div class="col-md-4">
                                <h2 class="text-success" id="totalPresent">0</h2>
                                <p class="text-muted">Days Present</p>
                            </div>
                            <div class="col-md-4">
                                <h2 class="text-danger" id="totalAbsent">0</h2>
                                <p class="text-muted">Days Absent</p>
                            </div>
                            <div class="col-md-4">
                                <h2 class="text-primary" id="attendancePercentage">0%</h2>
                                <p class="text-muted">Attendance Percentage</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script>
        if (sessionStorage.getItem('userRole') !== 'student') {
            window.location.href = '../index.html';
        }

        document.getElementById('studentName').textContent = sessionStorage.getItem('username') || 'Student';

        function logout() {
            sessionStorage.clear();
            window.location.href = '../index.html';
        }

        // Load attendance summary
        async function loadSummary() {
            try {
                const history = await apiCall(API.attendance.history);
                const studentData = JSON.parse(sessionStorage.getItem('studentData') || '{}');
                const studentName = studentData.name;
                
                let presentCount = 0;
                let absentCount = 0;

                history.forEach(record => {
                    if (record.present?.includes(studentName)) {
                        presentCount++;
                    }
                    if (record.absent?.includes(studentName)) {
                        absentCount++;
                    }
                });

                const total = presentCount + absentCount;
                const percentage = total > 0 ? ((presentCount / total) * 100).toFixed(2) : 0;

                document.getElementById('totalPresent').textContent = presentCount;
                document.getElementById('totalAbsent').textContent = absentCount;
                document.getElementById('attendancePercentage').textContent = percentage + '%';
            } catch (error) {
                console.error('Error loading summary:', error);
            }
        }

        loadSummary();
    </script>
</body>
</html>
