<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
            <button class="btn btn-outline-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-body">
                        <h3 class="text-center mb-4">
                            <i class="fas fa-user-circle me-2"></i>My Profile
                        </h3>

                        <div class="text-center mb-4">
                            <i class="fas fa-user-circle" style="font-size: 6rem; color: #6c63ff;"></i>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><strong>Name:</strong></label>
                            <p class="form-control-plaintext" id="profileName">-</p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><strong>USN:</strong></label>
                            <p class="form-control-plaintext" id="profileUSN">-</p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><strong>Department:</strong></label>
                            <p class="form-control-plaintext" id="profileDepartment">-</p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><strong>Year:</strong></label>
                            <p class="form-control-plaintext" id="profileYear">-</p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><strong>Email:</strong></label>
                            <p class="form-control-plaintext" id="profileEmail">-</p>
                        </div>

                        <div class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            To update your profile information, please contact the administrator.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script>
        if (sessionStorage.getItem('userRole') !== 'student') {
            window.location.href = '../index.html';
        }

        // Load student data
        const studentData = JSON.parse(sessionStorage.getItem('studentData') || '{}');
        
        document.getElementById('profileName').textContent = studentData.name || '-';
        document.getElementById('profileUSN').textContent = studentData.usn || '-';
        document.getElementById('profileDepartment').textContent = studentData.department || '-';
        document.getElementById('profileYear').textContent = studentData.year || '-';
        document.getElementById('profileEmail').textContent = studentData.email || '-';

        function logout() {
            sessionStorage.clear();
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
