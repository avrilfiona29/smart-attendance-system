<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance | Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
            <button class="btn btn-outline-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <h3 class="mb-4"><i class="fas fa-calendar-check me-2"></i>My Attendance Records</h3>

                        <!-- Attendance Table -->
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Time</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="attendanceTableBody">
                                    <tr>
                                        <td colspan="3" class="text-center">
                                            <div class="spinner-border" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script>
        if (sessionStorage.getItem('userRole') !== 'student') {
            window.location.href = '../index.html';
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '../index.html';
        }

        // Load student attendance
        async function loadAttendance() {
            try {
                const history = await apiCall(API.attendance.history);
                const studentData = JSON.parse(sessionStorage.getItem('studentData') || '{}');
                const studentName = studentData.name;
                const tbody = document.getElementById('attendanceTableBody');
                
                const records = [];
                
                history.forEach(record => {
                    const date = new Date(record.date);
                    let status = 'Not Marked';
                    
                    // Check if student name is in present or absent list
                    if (record.present?.includes(studentName)) {
                        status = 'Present';
                    } else if (record.absent?.includes(studentName)) {
                        status = 'Absent';
                    }
                    
                    if (status !== 'Not Marked') {
                        records.push({
                            date: date.toLocaleDateString(),
                            time: date.toLocaleTimeString(),
                            status: status
                        });
                    }
                });

                if (records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center">No attendance records found</td></tr>';
                    return;
                }

                tbody.innerHTML = records.map(record => `
                    <tr>
                        <td>${record.date}</td>
                        <td>${record.time}</td>
                        <td>
                            <span class="badge ${record.status === 'Present' ? 'bg-success' : 'bg-danger'}">
                                <i class="fas fa-${record.status === 'Present' ? 'check' : 'times'} me-1"></i>
                                ${record.status}
                            </span>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                alert('Error loading attendance: ' + error.message);
            }
        }

        loadAttendance();
    </script>
</body>
</html>
